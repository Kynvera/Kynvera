<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Animated Kynvera symbol</title>
  <desc id="desc">Geometric strokes align and resolve into the Kynvera convergence symbol.</desc>
  <style>
    .trace { fill: none; stroke: #55D6E8; stroke-width: 6; stroke-linecap: square; stroke-linejoin: miter; stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 700ms cubic-bezier(.22,1,.36,1) forwards; }
    .final { fill: #55D6E8; opacity: 0; animation: resolve 350ms 850ms cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes resolve { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .trace { animation: none; stroke-dashoffset: 0; } .final { animation: none; opacity: 1; } }
  </style>
  <path class="trace" d="M8 10h14l16 16h18"/>
  <path class="trace" d="M8 54h14l16-22" style="animation-delay:180ms"/>
  <path class="final" d="M8 10h14l16 16h18v12H38L22 54H8l20-22L8 10Z"/>
</svg>
